<!DOCTYPE html>
<html>
<head>
    <title>8-BIT IT ACADEMY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #0f380f;
            --mid-green: #306230;
            --light-green: #8bac0f;
            --bright-green: #9bbc0f;
        }

        body {
            background-color: var(--dark-green);
            color: var(--light-green);
            font-family: 'Press Start 2P', cursive;
            padding: 20px;
            margin: 0;
            /* เพิ่ม Scanline Effect */
            background-image: linear-gradient(rgba(15, 56, 15, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            border: 8px solid var(--mid-green);
            padding: 30px;
            background-color: var(--bright-green);
            color: var(--dark-green);
            box-shadow: 10px 10px 0px var(--mid-green); /* สร้างมิติความหนา */
        }

        .header {
            text-align: center;
            border-bottom: 6px double var(--mid-green);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 { font-size: 24px; text-shadow: 4px 4px 0px var(--light-green); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .course-card {
            border: 4px solid var(--mid-green);
            padding: 15px;
            background: var(--light-green);
            transition: transform 0.1s;
            position: relative;
        }

        /* Hover Effect ให้เหมือนกดปุ่ม */
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 0px var(--mid-green);
        }

        .btn {
            background: var(--mid-green);
            color: var(--bright-green);
            padding: 12px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            border-bottom: 4px solid #000;
        }

        .btn:active {
            border-bottom: 0;
            margin-top: 19px;
        }

        img { 
            width: 100%; 
            image-rendering: pixelated; 
            border: 4px solid var(--dark-green);
            background: var(--bright-green);
        }

        .price-tag {
            background: var(--dark-green);
            color: var(--bright-green);
            padding: 5px;
            display: inline-block;
            margin-top: 10px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>> IT_COURSES.EXE</h1>
            <a href="/add" class="btn" style="display:inline-block;">[+ CREATE NEW QUEST]</a>
        </div>
        
        <div class="grid">
            {% for course in courses %}
            <div class="course-card">
                <img src="{{ course.image }}" alt="pixel art">
                <h3>{{ course.title }}</h3>
                <p style="font-size: 10px; line-height: 1.5;">{{ course.description }}</p>
                <div class="price-tag">REWARD: {{ course.price }} G</div>
                <a href="#" class="btn">START QUEST</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
